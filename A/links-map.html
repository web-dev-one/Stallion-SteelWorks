<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Stallion Steelworks – Visual Site & Brand Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Interactive open-graph map of Stallion Steelworks pages and partner brands." />
  <style>
    :root{ --gold:#f4b942; --rust:#c1440e; --bg:#0c0c0c; --edge:#5e5130; --ink:#e8e8e8; --panel:#101010; --ring:0 0 0 3px rgba(244,185,66,.3); }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:radial-gradient(circle at center,#1e1e1e 0%, #0c0c0c 100%);color:var(--ink);font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Arial}
    button:focus-visible, a:focus-visible{outline:none;box-shadow:var(--ring);border-radius:10px}

    header{
      padding:12px 14px;border-bottom:1px solid rgba(244,185,66,.25);
      display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:3;
      background:rgba(12,12,12,.85);backdrop-filter:blur(6px)
    }
    header h1{margin:0;font-size:clamp(14px,3.2vw,18px);letter-spacing:.02em;color:var(--gold);flex:1}
    .btn{appearance:none;border:1px solid rgba(244,185,66,.35);background:#181818;color:var(--gold);padding:8px 10px;border-radius:10px;font-weight:600;cursor:pointer}
    .btn:hover{border-color:var(--gold)}

    #wrap{height:calc(100% - 54px);display:grid;grid-template-columns:1fr 320px}
    #stage{position:relative;overflow:hidden;min-height:70vh;padding:0;margin:0}
    #graph{touch-action:none;display:block}

    .zoomhud{position:absolute; right:10px; bottom:10px; z-index:2; display:flex; flex-direction:column; gap:8px;}
    .fab{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:rgba(0,0,0,.55);border:1px solid rgba(244,185,66,.35);color:var(--gold);font-size:18px;cursor:pointer}
    .fab:active{transform:scale(.98)}

    aside#panel{border-left:1px solid rgba(244,185,66,.25);background:var(--panel);padding:12px;overflow:auto}
    h2{font-size:14px;color:var(--gold);margin:.2rem 0 .6rem}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    .badge{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid rgba(244,185,66,.3);border-radius:999px;margin:4px 4px 0 0;color:#eee;text-decoration:none}
    .badge:hover{border-color:var(--gold)}
    .filterBtn{margin:0 6px 8px 0}

    .sheet{
      position:fixed; left:0; right:0; bottom:0; z-index:4;
      background:rgba(12,12,12,.95); border-top:1px solid rgba(244,185,66,.25);
      backdrop-filter:blur(8px); transform:translateY(70%); transition:transform .28s ease;
      border-top-left-radius:14px; border-top-right-radius:14px;
    }
    .sheet.open{ transform:translateY(0%) }
    .sheet .grab{width:100%; display:flex; align-items:center; gap:12px; padding:10px 14px; cursor:pointer}
    .grip{width:36px;height:4px;border-radius:999px;background:#444;margin:0 auto}
    .sheet .content{padding:8px 14px 14px 14px; max-height:50vh; overflow:auto}

    @media (max-width:860px){ #wrap{grid-template-columns:1fr} aside#panel{display:none} }
    @media (prefers-reduced-motion:reduce){ .sheet{transition:none} }
  </style>
</head>
<body>
  <header>
    <button class="btn" id="homeBtn">← Back</button>
    <h1>Visual Site & Partner Map</h1>
    <button class="btn" id="toggleSheet" aria-expanded="false" aria-controls="mobileSheet">Filters ▾</button>
  </header>

  <div id="wrap">
    <div id="stage">
      <!-- IMPORTANT: xMinYMin meet anchors the SVG’s internal origin to the TOP-LEFT -->
      <svg id="graph" width="100%" height="100%" viewBox="0 0 1200 800" preserveAspectRatio="xMinYMin meet"></svg>
      <div class="zoomhud" aria-label="Map zoom controls">
        <button class="fab" id="zoomIn" title="Zoom in">＋</button>
        <button class="fab" id="zoomOut" title="Zoom out">－</button>
        <button class="fab" id="fitBtn" title="Fit">⤢</button>
      </div>
    </div>

    <aside id="panel">
      <h2>Filters</h2>
      <div class="row" id="filters"></div>
      <h2 style="margin-top:14px;">Quick Links</h2>
      <a class="badge" href="/index.html">🏠 Home</a>
      <a class="badge" href="/ourservicesmap.html">🗺️ Service Area Map</a>
      <a class="badge" href="/sitemap.xml" target="_blank" rel="noopener">🧭 sitemap.xml</a>
      <a class="badge" href="/contact.html">✉️ Contact</a>
    </aside>
  </div>

  <!-- Mobile bottom sheet -->
  <div class="sheet" id="mobileSheet" aria-hidden="true">
    <div class="grab" id="grabHandle"><div class="grip"></div></div>
    <div class="content">
      <h2>Filters</h2>
      <div class="row" id="mFilters"></div>
    </div>
  </div>

  <script>
  // ---------- Data ----------
  const N = (id, label, url, group) => ({ id, label, url, group });
  const nodes = [
    // brands
    N('okcorrals','The OK Corrals','https://theokcorrals.com/','Brand'),
    N('stallion','Stallion SteelWorks','https://stallionsteelworks.com/','Brand'),
    N('dog','Pet Safe Kennels','https://pet-safe-kennels.com/','Brand'),
    N('cat','Pet Safe Catios','https://petsafecatios.com/','Brand'),
    N('equine','Equine Estate Contractors','http://equineestatecontractors.com/','Brand'),
    N('kennel','PetSafeKennels.com','https://www.petsafekennels.com/','Brand'),
    // core
    N('home','Home','/index.html','Core'),
    N('about','About','/index.html#about','Core'),
    N('gallery','Gallery','/index.html#gallery','Core'),
    N('testimonials','Testimonials','/index.html#testimonials','Core'),
    N('contact','Contact','/contact.html','Core'),
    // services
    N('services','Services','/index.html#services','Services'),
    N('maremotel','Mare Motels','/services/maremotel.html','Services'),
    N('shade','Shade Structures','/services/shade-structures.html','Services'),
    N('steelbarns','Steel Barns','/services/steel-barns.html','Services'),
    N('corrals','Pipe Corrals','/services/pipe-corrals.html','Services'),
    N('arenas','Riding Arenas','/services/riding-arenas.html','Services'),
    N('customfab','Custom Fabrication','/services/custom-fabrication.html','Services'),
    // utility
    N('svcmap','Service Area Map','/ourservicesmap.html','Utility'),
    N('sitemap','sitemap.xml','/sitemap.xml','Utility'),
    N('linksmap','Links Graph (this)','/links-map.html','Utility')
  ];
  const links = [
    {source:'home', target:'services'}, {source:'home', target:'about'},
    {source:'home', target:'gallery'}, {source:'home', target:'testimonials'},
    {source:'home', target:'contact'}, {source:'home', target:'svcmap'},
    {source:'services', target:'maremotel'}, {source:'services', target:'shade'},
    {source:'services', target:'steelbarns'}, {source:'services', target:'corrals'},
    {source:'services', target:'arenas'}, {source:'services', target:'customfab'},
    {source:'home', target:'okcorrals'}, {source:'home', target:'stallion'},
    {source:'home', target:'dog'}, {source:'home', target:'cat'},
    {source:'home', target:'equine'}, {source:'home', target:'kennel'},
    {source:'home', target:'sitemap'}, {source:'home', target:'linksmap'},
  ];

  const groupStyle = {
    Brand: { color:'#7cc4ff', emoji:'🔗' },
    Core:  { color:'#f4b942', emoji:'⭐' },
    Services: { color:'#c1440e', emoji:'🛠️' },
    Utility: { color:'#9be39b', emoji:'🧭' }
  };

  // ---------- SVG / layers ----------
  const svg = document.getElementById('graph');
  const gAll = document.createElementNS('http://www.w3.org/2000/svg','g');
  const gEdges = document.createElementNS('http://www.w3.org/2000/svg','g');
  const gNodes = document.createElementNS('http://www.w3.org/2000/svg','g');
  gAll.appendChild(gEdges); gAll.appendChild(gNodes); svg.appendChild(gAll);

  // Transform state
  let scale = 1.0, offsetX = 0, offsetY = 0;
  const isMobile = () => window.innerWidth < 860;

  // ---------- Seed positions ----------
  // On mobile, start near (150,150) so the cluster is visible even pre-fit
  function seedPositions(){
    const W = 1200, H = 800;
    const r = isMobile() ? 140 : 240;
    const cx = isMobile() ? 150 : W/2;
    const cy = isMobile() ? 150 : H/2;
    nodes.forEach((n, i) => {
      const a = (i / nodes.length) * Math.PI * 2;
      n.x = cx + Math.cos(a)*r + (Math.random()*30-15);
      n.y = cy + Math.sin(a)*r + (Math.random()*30-15);
      n.vx = 0; n.vy = 0;
    });
  }
  seedPositions();

  // ---------- Physics ----------
  function nodeById(id){ return nodes.find(n => n.id === id); }
  function tick() {
    const kCenter = 0.0015, kCharge = 6000, kSpring = 0.02, linkLen = 120, damp = 0.87;
    for (const l of links) {
      const a = nodeById(l.source), b = nodeById(l.target);
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.max(0.01, Math.hypot(dx,dy));
      const f = (d - linkLen) * kSpring, fx = f * dx/d, fy = f * dy/d;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }
    for (let i=0;i<nodes.length;i++){
      for (let j=i+1;j<nodes.length;j++){
        const a = nodes[i], b = nodes[j], dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy+0.01;
        const f = kCharge/d2, invd = 1/Math.sqrt(d2);
        a.vx -= f*dx*invd; a.vy -= f*dy*invd; b.vx += f*dx*invd; b.vy += f*dy*invd;
      }
    }
    const cx = isMobile()? 150 : 600, cy = isMobile()? 150 : 400;
    for (const n of nodes){
      n.vx += (cx - n.x) * kCenter;
      n.vy += (cy - n.y) * kCenter;
      n.x += n.vx; n.y += n.vy; n.vx *= damp; n.vy *= damp;
    }
  }

  // ---------- Build elements ----------
  const edgeEls = links.map(l => {
    const el = document.createElementNS('http://www.w3.org/2000/svg','line');
    el.setAttribute('stroke','var(--edge)'); el.setAttribute('stroke-width','1.4'); el.setAttribute('stroke-linecap','round');
    gEdges.appendChild(el); return {el,l};
  });

  const nodeEls = nodes.map(n => {
    const group = groupStyle[n.group] || { color:'#888', emoji:'•' };
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r', 22); c.setAttribute('fill', '#141414'); c.setAttribute('stroke', group.color); c.setAttribute('stroke-width','3');
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    const short = n.label.length > 18 ? n.label.split(' ')[0] : n.label;
    t.textContent = group.emoji + ' ' + short;
    t.setAttribute('fill','white'); t.setAttribute('font-size','14'); t.setAttribute('dominant-baseline','middle'); t.setAttribute('x','28');
    g.appendChild(c); g.appendChild(t); gNodes.appendChild(g);

    // drag/tap
    let dragging=false, last=null;
    g.addEventListener('pointerdown', e=>{ dragging=true; last={x:e.clientX,y:e.clientY}; g.setPointerCapture(e.pointerId); });
    g.addEventListener('pointermove', e=>{ if(!dragging) return; const dx=(e.clientX-last.x)/scale, dy=(e.clientY-last.y)/scale; n.x+=dx; n.y+=dy; n.vx=n.vy=0; last={x:e.clientX,y:e.clientY}; });
    g.addEventListener('pointerup', ()=> dragging=false);
    g.style.cursor='pointer';
    g.addEventListener('click', e=>{ if(!n.url) return; const ext=/^https?:\/\//i.test(n.url); window.open(n.url, ext?'_blank':'_self'); e.stopPropagation(); });

    return {g,node:n};
  });

  // ---------- Render & transform ----------
  function render(){
    edgeEls.forEach(({el,l})=>{
      const a=nodeById(l.source), b=nodeById(l.target);
      el.setAttribute('x1',a.x); el.setAttribute('y1',a.y);
      el.setAttribute('x2',b.x); el.setAttribute('y2',b.y);
    });
    nodeEls.forEach(({g,node})=>{ g.setAttribute('transform',`translate(${node.x},${node.y})`); });
  }
  function updateView(){ gAll.setAttribute('transform', `translate(${offsetX},${offsetY}) scale(${scale})`); }

  // ---------- Fit helpers ----------
  // HARD top-left fit: compute the "fit" scale and then multiply it by a zoom factor.
  // zoomFactor > 1 => BIGGER (zoom in), zoomFactor < 1 => smaller (zoom out).
  function fitGraphHardTopLeft(zoomFactor = 10){
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    nodes.forEach(n => { if(n.x<minX)minX=n.x; if(n.x>maxX)maxX=n.x; if(n.y<minY)minY=n.y; if(n.y>maxY)maxY=n.y; });

    const w = svg.clientWidth  || window.innerWidth;
    const h = svg.clientHeight || window.innerHeight;

    const scaleX = w / Math.max(1,(maxX-minX));
    const scaleY = h / Math.max(1,(maxY-minY));
    const fitScale = Math.min(scaleX, scaleY);

    // Make it 10× larger on mobile by default
    scale = Math.max(0.25, fitScale * zoomFactor);

    // Pin bbox top-left at (0,0)
    offsetX = -minX * scale;
    offsetY = -minY * scale;
    updateView();
  }

  // Desktop centered fit (normal size)
  function fitGraphCentered(pad=120, zoomFactor=1){
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    nodes.forEach(n=>{ if(n.x<minX)minX=n.x; if(n.x>maxX)maxX=n.x; if(n.y<minY)minY=n.y; if(n.y>maxY)maxY=n.y; });

    const w=svg.clientWidth||window.innerWidth, h=svg.clientHeight||window.innerHeight;
    const scaleX = (w - pad*2) / Math.max(1, maxX-minX);
    const scaleY = (h - pad*2) / Math.max(1, maxY-minY);
    const fitScale = Math.min(scaleX, scaleY);

    scale = Math.max(0.25, fitScale * zoomFactor);
    const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
    offsetX = w/2 - cx*scale;
    offsetY = h/2 - cy*scale;
    updateView();
  }

  // ---------- Gestures ----------
  svg.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const rect=svg.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top;
    const s=Math.exp(-e.deltaY*0.0015);
    offsetX = mx - (mx - offsetX)*s; offsetY = my - (my - offsetY)*s; scale*=s; updateView();
  }, {passive:false});

  let pointers=new Map();
  const pts=()=>Array.from(pointers.values());
  const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

  svg.addEventListener('pointerdown', e=>{ svg.setPointerCapture(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); });
  svg.addEventListener('pointermove', e=>{
    if(!pointers.has(e.pointerId)) return;
    const prev=pointers.get(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const P=pts();
    if(P.length===1){ offsetX += e.clientX-prev.x; offsetY += e.clientY-prev.y; updateView(); }
    else if(P.length===2){
      const [a,b]=P; const m=mid(a,b); const d0=dist(prev, a===prev?b:prev); const d1=dist(a,b);
      if(d0&&d1){ const s=d1/d0; offsetX = m.x - (m.x - offsetX)*s; offsetY = m.y - (m.y - offsetY)*s; scale*=s; updateView(); }
    }
  });
  svg.addEventListener('pointerup', e=>{ pointers.delete(e.pointerId); });
  svg.addEventListener('pointercancel', e=>{ pointers.delete(e.pointerId); });

  // ---------- Filters ----------
  const groups=[...new Set(nodes.map(n=>n.group))];
  const active=new Set(groups);
  function addFilter(where, group){
    const btn=document.createElement('button'); btn.className='btn filterBtn'; btn.textContent=group;
    btn.onclick=()=>{
      if(active.has(group)) active.delete(group); else active.add(group);
      nodeEls.forEach(({g,node})=> g.style.display = active.has(node.group)?'':'none');
      edgeEls.forEach(({el,l})=>{
        const a=nodeById(l.source), b=nodeById(l.target);
        el.style.display = (active.has(a.group)&&active.has(b.group))?'':'none';
      });
    };
    where.appendChild(btn);
  }
  const filtersWrap=document.getElementById('filters'), mFiltersWrap=document.getElementById('mFilters');
  groups.forEach(g=>{ addFilter(filtersWrap,g); addFilter(mFiltersWrap,g); });

  // ---------- Buttons ----------
  document.getElementById('homeBtn').onclick=()=> history.length>1?history.back():(window.location.href='/index.html');
  document.getElementById('zoomIn').onclick=()=>{ const s=1.18, cx=svg.clientWidth/2, cy=svg.clientHeight/2; offsetX=cx-(cx-offsetX)*s; offsetY=cy-(cy-offsetY)*s; scale*=s; updateView(); };
  document.getElementById('zoomOut').onclick=()=>{ const s=1/1.18, cx=svg.clientWidth/2, cy=svg.clientHeight/2; offsetX=cx-(cx-offsetX)*s; offsetY=cy-(cy-offsetY)*s; scale*=s; updateView(); };

  // Fit: desktop centers (normal); mobile anchors top-left and 10× bigger
  document.getElementById('fitBtn').onclick=()=>{ if(isMobile()) fitGraphHardTopLeft(10); else fitGraphCentered(120,1); };

  // ---------- Main loop + robust initial fit ----------
  function loop(){ tick(); render(); requestAnimationFrame(loop); }

  function initialFit(){
    if(isMobile()){
      // ~10× bigger and anchored to top-left
      fitGraphHardTopLeft(10);

      // Re-fit a couple times in case of late layout shifts (address bar/sheet)
      let reps=0;
      const t = setInterval(()=>{ fitGraphHardTopLeft(10); if(++reps>=3) clearInterval(t); }, 180);
    }else{
      fitGraphCentered(140,1);
    }
  }

  // Start
  window.addEventListener('load', ()=>{ initialFit(); updateView(); render(); loop(); });
  window.addEventListener('resize', ()=>{ initialFit(); });

  // bottom sheet controls
  const sheet=document.getElementById('mobileSheet'), toggleSheet=document.getElementById('toggleSheet'), grab=document.getElementById('grabHandle');
  function setSheet(open){ sheet.classList.toggle('open',open); sheet.setAttribute('aria-hidden',open?'false':'true'); toggleSheet.setAttribute('aria-expanded',open?'true':'false'); }
  toggleSheet.onclick=()=>setSheet(!sheet.classList.contains('open'));
  grab.onclick=()=>setSheet(!sheet.classList.contains('open'));
  </script>
</body>
</html>
